version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL Database
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: alumniconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alumni_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alumni_secure_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-alumniconnect_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alumni_admin} -d ${POSTGRES_DB:-alumniconnect_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - alumniconnect-network

  # ============================================================================
  # 2. Redis Cache & Message Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: alumniconnect-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - alumniconnect-network

  # ============================================================================
  # 3. AI / Machine Learning Service (FastAPI)
  # ============================================================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: alumniconnect-ai-service
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000
      - INTERNAL_API_SECRET_KEY=${INTERNAL_API_SECRET_KEY:-dev_internal_shared_secret_between_backend_and_ai_service_32b}
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - alumniconnect-network

  # ============================================================================
  # 4. Main Backend Service (NestJS)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alumniconnect-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-alumni_admin}:${POSTGRES_PASSWORD:-alumni_secure_password_dev}@postgres:5432/${POSTGRES_DB:-alumniconnect_db}?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev_jwt_access_secret_change_in_production_min_32_bytes_long}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_change_in_production_min_32_bytes_long}
      - INTERNAL_API_SECRET_KEY=${INTERNAL_API_SECRET_KEY:-dev_internal_shared_secret_between_backend_and_ai_service_32b}
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - alumniconnect-network

  # ============================================================================
  # 5. Frontend Client Application (Next.js)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alumniconnect-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api/v1
      - NEXT_PUBLIC_WS_URL=http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alumniconnect-network

networks:
  alumniconnect-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
