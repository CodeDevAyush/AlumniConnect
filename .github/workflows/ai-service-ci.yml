name: AI Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'ai-service/**'
      - '.github/workflows/ai-service-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements-dev.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Pytest
        run: pytest
        env:
          INTERNAL_API_SECRET_KEY: dev_internal_shared_secret_between_backend_and_ai_service_32b
          ENVIRONMENT: test
